name: CI-CD Sentinel-X

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ---------- TEST 1 : dashboard Next.js (types + tests unitaires + build) ----------
  dashboard:
    name: "1 - Dashboard Next.js (types, tests, build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable            # installe le pnpm demandé par package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # ---------- TEST 2 : firmware ESP8266 + script caméra + scripts serveur ----------
  firmware:
    name: "2 - Firmware ESP8266 (3 environnements) + scripts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      # Les vrais secrets ne sont jamais dans Git : on compile avec les fichiers modèles
      - run: |
          cp firmware/include/secrets.example.h firmware/include/secrets.h
          cp firmware/include/ca_cert.example.h firmware/include/ca_cert.h
      - run: pio run -d firmware -e nodemcuv2 -e calibration -e test
      - name: Syntaxe du script caméra et des scripts serveur
        run: |
          python -m py_compile ai/vision.py
          for f in server/*.sh tests/*.sh; do bash -n "$f"; done

  # ---------- TEST 3 : broker Mosquitto (TLS, comptes, ACL) avec la config du projet ----------
  mqtt-tls:
    name: "3 - Broker MQTT : TLS, comptes et ACL"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mosquitto mosquitto-clients
      - run: sudo systemctl stop mosquitto || true
      - run: bash tests/mqtt_tls_test.sh

  # ---------- TEST 4 : image Docker du dashboard + smoke test ----------
  docker-smoke:
    name: "4 - Image Docker du dashboard + smoke test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t sentinel-dashboard:ci .
      - name: Lancer le conteneur
        run: docker run -d --name dash -p 3000:3000 -e SENTINEL_INGEST_TOKEN=ci-token sentinel-dashboard:ci
      - name: Smoke test
        run: SENTINEL_INGEST_TOKEN=ci-token bash tests/smoke_dashboard.sh http://localhost:3000
      - name: Logs du conteneur (si échec)
        if: failure()
        run: docker logs dash

  # ---------- TEST 5 : sécurité (dépendances, secrets, Dockerfile) ----------
  security:
    name: "5 - Sécurité (Trivy : failles, secrets, Dockerfile)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Trivy
        run: |
          docker run --rm -v "$PWD":/src aquasec/trivy:latest fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src

  # ---------- CD : déploiement sur le Raspberry Pi (runner installé sur le Pi) ----------
  deploy:
    name: "Déploiement sur le Raspberry Pi"
    needs: [dashboard, firmware, mqtt-tls, docker-smoke, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64]
    concurrency:
      group: deploy-pi
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Copier le code vers ~/sentinel-x (les secrets restent sur le Pi)
        run: |
          mkdir -p "$HOME/sentinel-x"
          rsync -a --delete \
            --exclude '.git' --exclude '.github' \
            --exclude 'server/.env' --exclude 'server/certs' \
            --exclude 'server/mosquitto/config/passwd' \
            --exclude 'firmware/include/secrets.h' --exclude 'firmware/include/ca_cert.h' \
            ./ "$HOME/sentinel-x/"
      - name: Mettre à jour les dépendances de la caméra (seulement si elles ont changé)
        run: |
          cd "$HOME/sentinel-x"
          if ! cmp -s ai/requirements.txt "$HOME/.sentinel-requirements.last" 2>/dev/null; then
            "$HOME/sentinel-venv/bin/pip" install -q -r ai/requirements.txt
            cp ai/requirements.txt "$HOME/.sentinel-requirements.last"
          fi
      - name: Relancer MQTT, base de données et dashboard
        run: cd "$HOME/sentinel-x/server" && docker compose up -d --build --remove-orphans
      - name: Relancer le service caméra
        run: sudo -n systemctl restart sentinel-vision
      - name: Vérifier que le dashboard répond
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker compose -f "$HOME/sentinel-x/server/docker-compose.yml" logs --tail 50
          exit 1
